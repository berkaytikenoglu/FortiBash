# ==============================================================================
# BashWAF - Web Application Firewall Inspection Rules
# ==============================================================================

# SQL Injection Inspection Patterns
if ($query_string ~* "(\bunion\b.*\bselect\b|\bselect\b.*\bfrom\b|\binsert\b.*\binto\b|\bdrop\b.*\btable\b)") {
    return 403;
}
if ($query_string ~* "(concat\(|char\(|schema\(|information_schema)") {
    return 403;
}
if ($query_string ~* "('|\%27).*(\bor\b|\band\b).*(=|%3D)") {
    return 403;
}

# Cross-Site Scripting (XSS) Inspection Patterns
if ($query_string ~* "(<script|%3Cscript|javascript:|vbscript:|onload=|onerror=|eval\(|document\.cookie)") {
    return 403;
}

# Path Traversal & Local/Remote File Inclusion (LFI/RFI)
if ($query_string ~* "(\.\./|\.\.\\|etc/passwd|/proc/self/environ|win.ini|boot.ini)") {
    return 403;
}

# Restrict Allowed HTTP Request Methods
if ($request_method !~ ^(GET|HEAD|POST|OPTIONS|PUT|DELETE)$) {
    return 405;
}
