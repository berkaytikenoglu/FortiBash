# ==============================================================================
# BashWAF - Malicious User-Agent & Scanner Blocking Map
# ==============================================================================

map $http_user_agent $blocked_bot {
    default 0;
    ~*(?i)(sqlmap|nikto|wpscan|masscan|zgrab|acunetix|nessus|openvas) 1;
    ~*(?i)(dirbuster|gobuster|ffuf|hydra|nmap|havij|arachni|netsparker) 1;
    ~*(?i)(morfeus|fuzz|blackwidow|autoinspect|prowler|whatweb) 1;
}
